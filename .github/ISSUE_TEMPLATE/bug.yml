name: Bug
description: A reproducible problem in Sloy UI
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Component, catalogue route, minimal example and actions. Write the report in English.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version or commit, browser, viewport size, theme and local contexts.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs or links without secrets.
