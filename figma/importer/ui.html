<!doctype html><html lang="en"><meta charset="utf-8"><style>
body{font:13px/1.5 Inter,system-ui;margin:20px;background:var(--figma-color-bg,#fff);color:var(--figma-color-text,#222)}h1{font-size:20px;margin:0 0 8px}p{color:var(--figma-color-text-secondary,#555)}fieldset{border:1px solid #aaa5;border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{display:flex;gap:6px;align-items:center}button{border:1px solid #aaa6;border-radius:8px;padding:9px 12px;margin:10px 4px 0 0;background:var(--figma-color-bg-secondary,#eee);color:inherit;cursor:pointer}#import{width:100%;background:#333;color:#fff}#result{white-space:pre-wrap;font-size:12px;margin-top:12px}button:focus-visible{outline:2px solid #777;outline-offset:3px}
</style><h1>One scale. Every accent.</h1><p>Creates Neutral (12 variables), Accent (12 variables with your selected modes), and Appearance (24 variables, Light / Dark). Set Appearance on the screen and Accent on any component frame.</p><fieldset id="modes"><legend>Accent modes</legend></fieldset><button id="all">All 18</button><button id="compact">Neutral + Blue + Purple + Teal</button><button id="import">Create variables</button><div id="result" role="status"></div>
<script>
const modes='neutral rose pink fuchsia purple violet indigo blue sky cyan teal emerald green lime yellow amber orange red'.split(' '), field=document.getElementById('modes'), status=document.getElementById('result');
for(const mode of modes){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=mode;input.checked=true;label.append(input,document.createTextNode(mode));field.append(label)}
document.getElementById('all').onclick=()=>field.querySelectorAll('input').forEach(i=>i.checked=true);
document.getElementById('compact').onclick=()=>field.querySelectorAll('input').forEach(i=>i.checked=['neutral','blue','purple','teal'].includes(i.value));
document.getElementById('import').onclick=()=>{status.textContent='Creating variables…';document.getElementById('import').disabled=true;parent.postMessage({pluginMessage:{type:'import',modes:[...field.querySelectorAll('input:checked')].map(i=>i.value)}},'*')};
onmessage=e=>{const msg=e.data.pluginMessage;if(!msg)return;document.getElementById('import').disabled=false;status.textContent=msg.type==='error'?msg.message:JSON.stringify(msg.result,null,2)};
</script></html>
